# Jam-hosted agent roster for the Stage 7 conference flow, read by demo/jam-agents.sh.
#
# Every value uses `: "${VAR:=default}"`, so a value already set in the environment or
# in the local account file (.env.jam-agents, git-ignored) wins over the default here.
# Keep account details and credentials out of this tracked file.

# Space-separated agent keys. Each key prefixes the settings below.
# NAME is the Band display name; SESSION is the local id the script uses to find the
# agent (lowercase, no spaces; defaults to NAME lowercased with spaces as dashes).
: "${JAM_AGENTS:=manager qa}"

# Engineering Manager: Jam-hosted Codex, no approval prompts, full tool access.
: "${manager_NAME:=Engineering Manager}"
: "${manager_SESSION:=engineering-manager}"
: "${manager_DESCRIPTION:=Engineering Manager: coordinates delivery, the shared board, and evidence closeout}"
: "${manager_INSTRUCTIONS:=demo/skills/guestboard-manager/SKILL.md}"
: "${manager_TRANSPORT:=codex-app-server}"
: "${manager_MODEL:=gpt-5.6-sol}"
: "${manager_EFFORT:=high}"
: "${manager_APPROVAL:=never}"
: "${manager_SANDBOX:=danger-full-access}"

# QA Manager: Jam-hosted Claude Code, permission checks bypassed.
: "${qa_NAME:=QA Manager}"
: "${qa_SESSION:=qa-manager}"
: "${qa_DESCRIPTION:=QA Manager: reviews supplied Developer repair evidence and returns one verdict}"
: "${qa_INSTRUCTIONS:=demo/skills/guestboard-qa/SKILL.md}"
: "${qa_TRANSPORT:=claude-code-cli}"
: "${qa_MODEL:=claude-opus-5-5}"
: "${qa_EFFORT:=high}"
: "${qa_CLAUDE_PERMISSION_MODE:=bypassPermissions}"
